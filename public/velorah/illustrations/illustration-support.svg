  <circle cx="470" cy="110" r="24" fill="none" stroke="#374151" stroke-width="2.5"/>
  <polyline points="458,110 466,120 484,100" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══ STARS ═══ -->
  <g transform="translate(430, 155)">
    <polygon points="12,0 15,8 24,9 17,15 19,24 12,19 5,24 7,15 0,9 9,8" fill="#1f2937"/>
    <polygon points="40,0 43,8 52,9 45,15 47,24 40,19 33,24 35,15 28,9 37,8" fill="#1f2937"/>
    <polygon points="68,0 71,8 80,9 73,15 75,24 68,19 61,24 63,15 56,9 65,8" fill="#1f2937"/>
    <polygon points="26,28 29,36 38,37 31,43 33,52 26,47 19,52 21,43 14,37 23,36" fill="#1f2937"/>
    <polygon points="54,28 57,36 66,37 59,43 61,52 54,47 47,52 49,43 42,37 51,36" fill="#1f2937"/>
  </g>
</svg>