  <rect x="58" y="174" width="100" height="5" rx="2" fill="#D4C5A9"/>
  <rect x="58" y="185" width="130" height="5" rx="2" fill="#D4C5A9"/>
  <polygon points="120,208 110,222 140,208" fill="white" stroke="#374151" stroke-width="2"/>
  <rect x="108" y="206" width="34" height="4" fill="white"/>

