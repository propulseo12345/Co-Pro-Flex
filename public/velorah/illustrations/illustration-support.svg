  <path d="M325 230 Q322 210 328 200" fill="#1f2937"/>
  <path d="M415 230 Q418 210 412 200" fill="#1f2937"/>
  <!-- Side hair -->
  <path d="M328 220 Q320 230 322 260 Q324 250 330 240" fill="#1f2937"/>
  <path d="M412 220 Q420 230 418 260 Q416 250 410 240" fill="#1f2937"/>

