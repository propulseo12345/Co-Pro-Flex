# Intégration continue — garde-fou anti-régression sur chaque PR.
#
# Conception (volontairement honnête vis-à-vis de l'état réel du repo) :
#   • Gate BLOQUANT = `tsc --noEmit` (0 erreur aujourd'hui) + `vitest` (97/97) + `eslint`.
#     Ce sont les signaux 100 % reproductibles : s'ils cassent, c'est une vraie régression.
#   • Lint = BLOQUANT depuis 2026-06-13 (J4) : les 13 erreurs pré-existantes ont été résorbées,
#     le job échoue désormais sur toute NOUVELLE erreur. Les warnings (~800 : `any`, console.*,
#     unused) ne cassent pas la CI et restent visibles dans les logs comme dette à résorber.
#   • db:test = job séparé BLOQUANT depuis la re-baseline (2026-06-10) : il lève une stack
#     Supabase locale (fresh runner), applique 0001→0044 + seed, et lance les gates SQL.
#     La reproductibilité est PROUVÉE (0001→0044 rejoue à 0 erreur + smoke audit=0,
#     cf. `scripts/rebaseline-check.sh`), donc un échec ici = vraie régression, pas un aléa d'infra.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Annule les runs obsolètes quand on pousse plusieurs fois sur la même PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check · Lint · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Type check (bloquant)
        run: npx tsc --noEmit

      - name: Lint (bloquant — 0 erreur ESLint exigée)
        run: npm run lint

      - name: Tests unitaires / logique pure (bloquant)
        run: npm test

  db-tests:
    name: Gates SQL (db:test) — bloquant
    runs-on: ubuntu-latest
    needs: quality
    # BLOQUANT depuis la re-baseline (2026-06-10) : la chaîne 0001→0044 est prouvée reproductible.
    # `supabase start` applique migrations + seed sur un runner neuf ; un échec = vraie régression.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          # Épinglée = même CLI que le rejeu de référence local (méthode drift).
          # `latest` a cassé main le 2026-06-11 (changement des droits par défaut
          # du rôle authenticated dans le stack local → permission denied dans les
          # gates qui font SET ROLE authenticated, sur toutes les branches).
          version: 2.105.0

      - name: Démarrer Supabase (applique migrations + seed)
        run: supabase start

      - name: Lancer les gates SQL d'intégrité financière
        env:
          # Nom du conteneur Postgres créé par `supabase start` (project_id = Co-Pro-Flex).
          SUPABASE_DB_CONTAINER: supabase_db_Co-Pro-Flex
        run: npm run db:test

      - name: Arrêter Supabase
        if: always()
        run: supabase stop --no-backup
